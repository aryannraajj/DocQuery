<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Question Answering System</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🤖</div>
                <h1>AI Document Assistant</h1>
            </div>
            <p class="subtitle">Upload your documents and ask questions - powered by AI</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="card upload-section">
                <h2 class="section-title">
                    <span class="icon">📄</span>
                    Upload Documents
                </h2>
                
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">☁️</div>
                    <p class="upload-text">Drag & drop files here</p>
                    <p class="upload-subtext">or</p>
                    <button class="btn btn-primary" id="browseBtn">
                        <span>Browse Files</span>
                    </button>
                    <input type="file" id="fileInput" accept=".pdf,.txt,.docx" multiple hidden>
                    <p class="upload-info">Supported: PDF, TXT, DOCX (max 10MB)</p>
                </div>

                <div class="document-list" id="documentList">
                    <h3 class="list-title">Uploaded Documents</h3>
                    <div id="documentsContainer">
                        <p class="empty-state">No documents uploaded yet</p>
                    </div>
                </div>
            </section>

            <!-- Question Section -->
            <section class="card question-section">
                <h2 class="section-title">
                    <span class="icon">💬</span>
                    Ask a Question
                </h2>
                
                <form id="questionForm" class="question-form">
                    <div class="input-group">
                        <textarea 
                            id="questionInput" 
                            placeholder="What would you like to know about your documents?"
                            rows="3"
                            maxlength="500"
                        ></textarea>
                        <div class="char-count" id="charCount">0/500</div>
                    </div>
                    <button type="submit" class="btn btn-gradient" id="askBtn">
                        <span>Ask Question</span>
                        <span class="btn-icon">🔍</span>
                    </button>
                </form>

                <div class="answer-container" id="answerContainer" style="display: none;">
                    <h3 class="answer-title">Answer</h3>
                    <div class="answer-content" id="answerContent"></div>
                    
                    <div class="sources-section" id="sourcesSection">
                        <h4 class="sources-title">Sources</h4>
                        <div class="sources-list" id="sourcesList"></div>
                    </div>
                    
                    <div class="answer-meta" id="answerMeta"></div>
                </div>
            </section>
        </main>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loader"></div>
            <p class="loading-text">Processing...</p>
        </div>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
